# Portainer Stack. Set NAS_LAN_IP, BROWSER_PASSWORD, PUID and PGID first.
# CDP (9222/9223) is NOT published on the NAS or Internet.
services:
  newtoki-browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: newtoki-browser
    environment:
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
      TZ: Asia/Seoul
      LC_ALL: ko_KR.UTF-8
      CUSTOM_USER: newtoki
      PASSWORD: ${BROWSER_PASSWORD:?Set a browser desktop password}
      CHROME_CLI: --user-data-dir=/config/newtoki-profile --remote-debugging-port=9222 about:blank
    volumes:
      - /volume1/docker/newtoki-browser:/config
    ports:
      - "${NAS_LAN_IP:?Set the NAS private LAN IP}:3011:3001"
    shm_size: 1gb
    restart: unless-stopped
    networks:
      - browser_net

  cdp-relay:
    image: alpine/socat:latest
    container_name: newtoki-cdp-relay
    network_mode: service:newtoki-browser
    depends_on:
      - newtoki-browser
    command: ["TCP-LISTEN:9223,fork,reuseaddr", "TCP:127.0.0.1:9222"]
    restart: unless-stopped

networks:
  browser_net:
    name: newtoki_browser_net
